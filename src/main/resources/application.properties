# Application Configuration
spring.application.name=DLATS
server.port=8080

# H2 Database in MySQL mode (persisted to ./data/dlats_db)
spring.datasource.url=jdbc:h2:file:./data/dlats_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Optional MySQL Configuration (uncomment to switch to MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/dlats?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static resources & File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# JWT Configuration
app.jwt.secret=dlatsSuperSecretKeyForJwtSigning2026DrivingLicenseApplicationTrackingSystem99887766
app.jwt.expiration-ms=86400000
