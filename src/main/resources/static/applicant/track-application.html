<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Application - DLATS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/track-application.css">
</head>
<body data-page="track-application">

<header>
    <div class="logo">
        <div class="logo-box">DL</div>
        <div>
            <h2>DLATS</h2>
            <p>Driving License Application Tracking System</p>
        </div>
    </div>

    <a href="dashboard.html">Back to Dashboard</a>
</header>

<main>

    <section class="track-page">

        <div class="track-heading">
            <h1>Track Application</h1>
            <p>Check the current status of your driving license application.</p>
        </div>

        <div id="alert-box" class="alert-box" style="display:none;"></div>

        <div class="track-box">

            <label>Application Number</label>

            <div class="track-input">
                <input type="text" id="track-input-no" value="DL202600101" placeholder="e.g. DL202600101, DL202600102, DL202600103">
                <button type="button" id="track-btn">Track</button>
            </div>

        </div>

        <div class="status-box" id="track-result-box">

            <div class="status-heading">
                <div>
                    <span>Application Number</span>
                    <strong id="track-app-no">DL202600101</strong>
                </div>

                <span class="current-status" id="track-current-status">
                    Document Verification
                </span>
            </div>

            <div class="status-timeline" id="track-timeline">
                <!-- Populated dynamically via JS -->
            </div>

        </div>

    </section>

</main>

<script src="../js/app.js"></script>
</body>
</html>
