<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Login - DriveTrack</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-box">DL</div>
            <div>
                <h2>DLATS</h2>
                <p>Driving License Application Tracking System</p>
            </div>
        </div>

        <a href="../index.html">Back to Home</a>
    </header>

    <main>

        <section class="login-page">

            <div class="login-box">

                <h1>Applicant Login</h1>

                <p>Login to manage your driving license application.</p>

                <div id="alert-box" class="alert-box" style="display:none;"></div>

                <form id="applicant-login-form">

                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" value="rahul@example.com" required>

                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" value="rahul123" required>

                    <button type="submit">Login</button>

                </form>

                <div class="demo-credentials">
                    <small>Demo Accounts: <strong>rahul@example.com</strong> / <code>rahul123</code> | <strong>priya@example.com</strong> / <code>priya123</code></small>
                </div>

                <p class="register-text">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>

            </div>

        </section>

    </main>

    <script src="../js/app.js"></script>
</body>
</html>
