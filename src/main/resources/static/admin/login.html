<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DLATS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-box">DL</div>
        <div>
            <h2>DLATS</h2>
            <p>Driving License Application Tracking System</p>
        </div>
    </div>

    <a href="../index.html">Back to Home</a>
</header>

<main>

    <section class="login-page">

        <div class="login-box">

            <h1>Admin / RTO Login</h1>

            <p>Login to manage driving license applications.</p>

            <div id="alert-box" class="alert-box" style="display:none;"></div>

            <form id="admin-login-form">

                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" value="admin@dlats.com" required>

                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" value="admin123" required>

                <button type="submit">Login</button>

            </form>

            <div class="demo-credentials">
                <small>Demo Accounts: <strong>admin@dlats.com</strong> / <code>admin123</code> | <strong>officer@dlats.com</strong> / <code>officer123</code></small>
            </div>

        </div>

    </section>

</main>

<script src="../js/app.js"></script>
</body>
</html>
